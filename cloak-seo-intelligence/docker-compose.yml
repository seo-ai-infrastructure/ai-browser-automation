# Local infrastructure for cloak-seo-intelligence.
#   - letta    : stateful agent runtime + ADE (http://localhost:8283)
#   - postgres : Letta's database (agent state, memory, message history)
#   - redis    : hot daily data + task queues
#
# Models are served *outside* this compose file (vMLX / MLX on the host). The
# Letta container reaches the host endpoint via host.docker.internal — see
# OPENAI_API_BASE in .env.

services:
  postgres:
    image: postgres:16-alpine
    container_name: cloak-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-letta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-letta}
      POSTGRES_DB: ${POSTGRES_DB:-letta}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cloak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-letta}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [cloak-net]

  redis:
    image: redis:7-alpine
    container_name: cloak-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - cloak-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [cloak-net]

  letta:
    image: letta/letta:latest
    container_name: cloak-letta
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8283:8283"
    environment:
      # Point Letta at the Postgres service above.
      LETTA_PG_URI: postgresql://${POSTGRES_USER:-letta}:${POSTGRES_PASSWORD:-letta}@postgres:5432/${POSTGRES_DB:-letta}
      # Model providers. For local-first, OPENAI_API_BASE -> your vMLX endpoint.
      OPENAI_API_BASE: ${OPENAI_API_BASE:-http://host.docker.internal:8080/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-local}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    extra_hosts:
      # Let the container reach a model server running on the host machine.
      - "host.docker.internal:host-gateway"
    volumes:
      - cloak-letta-data:/root/.letta
    restart: unless-stopped
    networks: [cloak-net]

networks:
  cloak-net:
    driver: bridge

volumes:
  cloak-postgres-data:
  cloak-redis-data:
  cloak-letta-data:
